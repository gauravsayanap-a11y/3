<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e17">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<title>Cipher</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#7a7f89;--line:#eceef2;--key:#eef0f3;--acc:#2563eb;--bull:#1f7a5a;--cow:#d98a1e;--ai:#7c4dff;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--ink:#f1f0ec;--mute:#9a9aa0;--line:#34363a;--key:#2e3033;--acc:#6ea8ff;--bull:#5fbf8f;--cow:#e9a94a;--ai:#b794ff;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--ink:#f1f0ec;--mute:#9a9aa0;--line:#34363a;--key:#2e3033;--acc:#6ea8ff;--bull:#5fbf8f;--cow:#e9a94a;--ai:#b794ff;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:440px;margin:0 auto;padding:22px 16px 32px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
h1 .mute{font-size:14px;font-weight:500;letter-spacing:0}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.mute{color:var(--mute);font-size:13px}
.u{color:var(--acc)}.a{color:var(--ai)}
input[type=checkbox]{accent-color:var(--acc)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
button{font:inherit;color:var(--ink);background:var(--key);border:0;border-radius:12px;padding:12px 4px;font-size:15px;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
.opt{flex:1;min-width:52px;font-weight:600}
.opt.sel{background:var(--acc);color:#fff}
#rb .opt.sel{background:var(--bull)}#rc .opt.sel{background:var(--cow)}
.wide{width:100%;font-size:16px;padding:15px;margin-top:10px;background:var(--acc);color:#fff;font-weight:600;border-radius:14px}
.ghost{background:var(--card);box-shadow:var(--shadow);color:var(--ink);font-weight:500}
.hide{display:none}
/* points */
#lvl{display:flex;justify-content:space-between;align-items:baseline}
#lvl b{font-size:20px}
.bar{height:10px;background:var(--key);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#38bdf8);border-radius:99px;transition:width .4s}
/* game */
#score{display:flex;justify-content:space-between;align-items:center;font-size:15px;background:var(--card);border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);margin-bottom:14px}
#score b{font-size:20px}
#logs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.box{height:164px;overflow-y:auto;padding:0 14px 8px;margin:0}
.hd{position:sticky;top:0;background:var(--card);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:12px 0 6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:4px;padding:7px 0}
.row+.row{border-top:1px solid var(--line)}
.g{font-size:18px;font-weight:600;letter-spacing:3px;font-variant-numeric:tabular-nums}
.bc{font-size:12px;font-weight:600;white-space:nowrap}
.bc .b{color:var(--bull)}.bc .c{color:var(--cow)}
.none{color:var(--mute);font-size:12px;padding:12px 0}
#msg{min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;font-size:14px;line-height:1.4;font-weight:600}
#bg{font-size:42px;letter-spacing:10px;text-align:center;font-weight:700;color:var(--ai);margin:6px 0 18px}
.rep .opt{font-size:17px;padding:12px 0}
#slots{display:flex;gap:10px;justify-content:center;margin:8px 0 16px}
.slot{width:54px;height:62px;background:var(--key);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600}
.slot.on{box-shadow:inset 0 0 0 2px var(--acc)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#pad button{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:16px 0;font-size:22px;font-weight:500}
#pad #go{background:var(--acc);color:#fff;font-size:16px;font-weight:600}
#pad button:disabled{box-shadow:none;background:var(--key)}
#opad button{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:16px 0;font-size:22px;font-weight:500}
#opad #ogo{background:var(--acc);color:#fff;font-size:16px;font-weight:600}
#opad button:disabled{box-shadow:none;background:var(--key)}
#ocode,#tcode{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--key);color:var(--ink);text-transform:uppercase;min-width:0}
/* history */
.gh{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;margin-top:10px}
.gh small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.gd{background:var(--card);border-radius:0 0 14px 14px;padding:4px 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gd .hd{position:static;padding:8px 0 4px}
/* premium look */
html:root:root{--bg:#0b0e17;--card:rgba(255,255,255,.05);--ink:#eef1f8;--mute:#8d96ab;--line:rgba(255,255,255,.08);--key:rgba(255,255,255,.07);--acc:#6c8cff;--bull:#5ad1a0;--cow:#f0b35a;--ai:#a98bff;--shadow:none;color-scheme:dark}
html,body{background:radial-gradient(900px 520px at 50% -8%,var(--bgtop,#1c2650) 0%,var(--bgbase,#0b0e17) 62%) fixed,var(--bgbase,#0b0e17);transition:background .4s}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
main{padding:26px 18px 40px}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,var(--tint,#9fb4ff));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:none;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#acct{padding:10px 14px}
#score{background:var(--card);border:1px solid var(--line);box-shadow:none}
button{transition:transform .12s,background .2s}
.opt{background:var(--key);border:1px solid transparent;border-radius:14px;font-weight:600;color:var(--ink)}
.opt.sel{background:linear-gradient(135deg,var(--g1,#5b7cff),var(--g2,#7aa0ff));color:#fff;box-shadow:0 6px 18px var(--glow,rgba(92,124,255,.3))}
#rb .opt.sel{background:var(--bull);color:#06281a;box-shadow:none}
#rc .opt.sel{background:var(--cow);color:#2b1a00;box-shadow:none}
.wide{background:linear-gradient(135deg,var(--g1,#5b7cff),var(--g2,#7aa0ff));box-shadow:0 10px 26px var(--glow,rgba(92,124,255,.28));border-radius:16px;padding:16px;letter-spacing:.02em}
.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.bar{height:8px;background:rgba(255,255,255,.08)}
.bar i{background:linear-gradient(90deg,var(--g1,#5b7cff),var(--g2,#7ad0ff))}
.hd{background:var(--hdbg,#151a2b)}
.row+.row{border-top:1px solid var(--line)}
.slot{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px}
.slot.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring,rgba(108,140,255,.2))}
#pad button,#opad button{background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:none;border-radius:16px;color:var(--ink)}
#pad #go,#opad #ogo{background:linear-gradient(135deg,var(--g1,#5b7cff),var(--g2,#7aa0ff));border:0;color:#fff;box-shadow:0 8px 20px var(--glow,rgba(92,124,255,.28))}
#pad button:disabled,#opad button:disabled{background:rgba(255,255,255,.04);box-shadow:none}
.gh{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.gd{background:var(--card);border:1px solid var(--line);border-top:0}
#bg{color:var(--ai);text-shadow:0 0 24px var(--aiglow,rgba(169,139,255,.4))}
#acct{display:flex;align-items:center;gap:12px;padding:12px 14px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g1,#5b7cff),var(--ai,#a98bff));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.at{cursor:pointer;flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.35}
.at small{display:block;color:var(--mute);font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.pill.go{background:linear-gradient(135deg,var(--g1,#5b7cff),var(--g2,#7aa0ff));border:0;color:#fff}
#sheet,#nsheet,#pop,#info{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,8,14,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#sheet.hide,#nsheet.hide,#pop.hide,#info.hide{display:none}
#pop,#info{z-index:60}
#info h3{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
#info li{font-size:13px;line-height:1.5;margin:3px 0}#info ul{margin:0;padding-left:18px}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;font-size:13px}
.lrow i{width:12px;height:12px;border-radius:50%;flex:none}
.lrow b{flex:1}.lrow.cur{background:var(--ring)}
.ptab{width:100%;border-collapse:collapse;font-size:12px}.ptab td,.ptab th{padding:5px 4px;text-align:center;border-top:1px solid var(--line)}.ptab th{color:var(--mute);font-weight:600;border-top:0}.ptab td:first-child,.ptab th:first-child{text-align:left}
.sheetbox{position:relative;width:100%;max-width:360px;background:var(--hdbg,#12172a);border:1px solid var(--line);border-radius:24px;padding:28px 22px 20px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sx{position:absolute;top:12px;right:12px;width:32px;height:32px;padding:0;border-radius:50%;font-size:14px;background:rgba(255,255,255,.07);color:var(--mute)}
.logo{width:56px;height:56px;margin:0 auto 12px;border-radius:18px;background:linear-gradient(135deg,var(--g1,#5b7cff),var(--ai,#a98bff));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff}
.sheetbox h2{margin:0 0 4px;font-size:22px}
.gbtn{width:100%;margin-top:18px;padding:13px;border-radius:14px;background:#fff;color:#1f1f1f;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:16px 0 14px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
#nick,#nname{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);margin-bottom:10px}
#nick:focus,#nname:focus{outline:none;border-color:var(--acc)}
.guest{width:100%;padding:13px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:600}
.small{font-size:12px;margin:14px 0 0}
.pinrow{display:flex;gap:8px;margin-bottom:8px}
.pinbtn{flex:1;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink)}
.pinbtn small{display:block;color:var(--mute);font-size:12px;letter-spacing:2px;margin-top:2px}
.pj{font-weight:600;color:var(--acc);font-size:14px}
.pinx{width:44px;padding:0;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mute)}
/* online chat */
#ochat{padding:10px}
#ochatL{max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-right:2px}
.cm{max-width:82%;padding:7px 12px;border-radius:15px;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.cm.me{align-self:flex-end;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-bottom-right-radius:5px}
.cm.th{align-self:flex-start;background:var(--key);border-bottom-left-radius:5px}
#ochatI{flex:1;min-width:0;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--key);color:var(--ink)}
#ochatI:focus{outline:none;border-color:var(--acc)}
/* tournament leaderboard + playoffs */
.lb{display:flex;align-items:center;gap:10px;padding:9px 0}
.lb+.lb{border-top:1px solid var(--line)}
.rk{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--key);color:var(--mute)}
.rk.p1{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:16px}
.rk.p2,.rk.p3{background:var(--key);color:var(--ink);font-size:16px}
.lb .nm{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .nm small{display:block;color:var(--mute);font-weight:400;font-size:11px;margin-top:1px}
.lb .st{text-align:right;font-size:12px;font-weight:600;white-space:nowrap}
.lb .st small{display:block;color:var(--mute);font-weight:400;font-size:11px;margin-top:1px}
.lb.me{background:linear-gradient(90deg,var(--ring),transparent);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--ring);color:var(--ink);margin-left:6px;vertical-align:1px}
.stage{padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.stage .sn{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.stage .vs{margin-top:4px;font-weight:600;font-size:14px}
.stage.live{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.howto{font-size:12px;line-height:1.55;color:var(--mute);margin:12px 0 0}
/* large screens: smaller, tidier */
@media (min-width:700px){main{max-width:380px;zoom:.85;padding-top:20px}.sheetbox{zoom:.88}}
@media (min-width:1100px){main{zoom:.78}.sheetbox{zoom:.82}}
/* ===== clean layout pass ===== */
.hide{display:none!important}
main>section:not(.hide){display:flex;flex-direction:column;gap:12px}
main .card,#logs{margin-bottom:0}
main .wide{margin-top:0}
.card .wide{margin-top:10px}.card .wide:first-child{margin-top:0}
button{min-height:46px;line-height:1.2}
.wide{min-height:52px}
.pill{min-height:40px;flex:none}
.sx{min-height:0;flex:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:8px 0 16px}
#dig,.rep .opts{grid-template-columns:repeat(auto-fit,minmax(48px,1fr))}
#fmt,#ofmt{grid-template-columns:repeat(2,1fr)}
#fmt .opt:first-child:nth-last-child(5),#ofmt .opt:first-child:nth-last-child(5){grid-column:1/-1}
.opt{min-width:0;padding:12px 6px}
.joinrow{display:flex;gap:8px;margin-top:10px}
.joinrow input{flex:1;min-width:0;min-height:46px}
.joinrow button{flex:none;width:92px;padding:0}
#onlinebox{margin-top:16px}
#onlinebox .mute+.wide{margin-top:8px}
.sect{margin:20px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
#pad button,#opad button{min-height:56px;padding:0}
#score{gap:10px}#score .mute{flex:1;min-width:0;text-align:center}
.gh{gap:12px}
#info h2{padding-right:40px}
.pinx{min-height:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);max-width:90vw;background:var(--hdbg,#12172a);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ask{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,8,14,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ask .joinrow{margin-top:20px}#ask .joinrow button{flex:1;width:auto}
#askOk{background:linear-gradient(135deg,var(--g1,#5b7cff),var(--g2,#7aa0ff));color:#fff;font-weight:600}
.gh{cursor:default}
.cn{display:block;font-size:10px;opacity:.7;margin-top:2px}
.notes{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:0 0 12px}
.nt{min-height:34px;padding:0;font-size:13px;border-radius:10px;background:var(--key);border:1px solid var(--line)}
.nt.x{text-decoration:line-through;opacity:.35}.nt.k{background:var(--bull);color:#06281a;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.stats div{text-align:center;min-width:0}.stats b{display:block;font-size:18px}.stats span{font-size:11px}

/* ===== hamburger menu + no header boxes ===== */
.hd{background:transparent!important;position:static!important}
.burger{flex:none;width:44px;min-height:44px;padding:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:transparent}
.burger i{display:block;width:20px;height:2px;border-radius:2px;background:var(--ink)}
#menuwrap{position:fixed;inset:0;z-index:40}
#menuback{position:absolute;inset:0;background:rgba(6,8,14,.45)}
#menu{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:16px;width:min(280px,calc(100vw - 32px));background:var(--hdbg,#12172a);border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#menu button{background:transparent;text-align:left;padding:12px 14px;border-radius:12px;font-size:15px}
#menu button:active{background:var(--key)}

/* ===== brick-style wrapping for option buttons ===== */
.opts{display:flex!important;flex-wrap:wrap;justify-content:center;gap:8px}
.opts .opt{flex:0 0 auto!important;width:104px;min-width:0}
#dig .opt,.rep .opt,#odig .opt{width:56px}
#fmt .opt,#ofmt .opt{width:150px}

#hintrow{display:flex;justify-content:flex-end;margin-bottom:-4px}
#hint{min-height:32px;padding:6px 14px;font-size:13px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--mute)}
</style>
</head>
<body>
<main>

  <section id="home">
    <div class="card" id="acct"><button id="burger" class="burger" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button><div class="av" id="av">?</div><div class="at" id="acctText"></div><button class="pill go" id="acctBtn">Sign in</button></div>
    <div class="card" id="pts"></div>
    <div class="card">
      <div class="mute">Mode</div>
      <div class="opts" id="mode"></div>
      <div class="mute">Number of digits</div>
      <div class="opts" id="dig"></div>
      <div id="fmtwrap"><div class="mute">Match format</div>
      <div class="opts" id="fmt"></div></div>
      <div id="onlinebox" class="hide"><div id="pins"></div>
      <div class="mute">Friend duel</div>
      <button class="wide" id="ocreate">Create room</button>
      <div class="joinrow"><input id="ocode" placeholder="Room code" maxlength="5"><button id="ojoin">Join</button></div>
      <div class="mute sect">Tournament</div>
      <button class="wide ghost" id="tcreate">Create tournament</button>
      <div class="joinrow"><input id="tcode" placeholder="Tournament code" maxlength="5"><button id="tjoin">Join</button></div></div>
      <button class="wide" id="start">Start match</button>
    </div>
    <div id="menuwrap" class="hide">
      <div id="menuback"></div>
